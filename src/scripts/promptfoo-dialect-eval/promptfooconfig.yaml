# Hutsul Dialect -> Standard Ukrainian LLM Baseline Evaluation
# Run with: make eval-dialect
# Or: OPENROUTER_API_KEY=<key> promptfoo eval --config src/scripts/promptfoo-dialect-eval/promptfooconfig.yaml

description: "Hutsul dialect to standard Ukrainian - LLM baseline comparison"

# Prompt strategies to compare
prompts:
  - id: file://prompts/zero_shot.txt
    label: "Zero-shot"

  - id: file://prompts/few_shot.txt
    label: "Few-shot (3 examples)"

  - id: file://prompts/rules_aware.txt
    label: "Rules-aware"

# Models to evaluate - all cloud providers via OpenRouter
providers:
  - id: openrouter:openai/gpt-4o-mini
    label: "GPT-4o Mini"
    config:
      temperature: 0.1
      max_tokens: 512

  - id: openrouter:google/gemini-2.0-flash-001
    label: "Gemini 2.0 Flash"
    config:
      temperature: 0.1
      max_tokens: 512

  - id: openrouter:mistralai/mistral-large-2411
    label: "Mistral Large"
    config:
      temperature: 0.1
      max_tokens: 512

  # TODO: Lapa LLM - not on OpenRouter as of 2026-02.
  # Model: lapa-llm/lapa-v0.1.2-instruct (Gemma-3-12B based, Ukrainian-focused)
  # To enable locally:
  #   vllm serve lapa-llm/lapa-v0.1.2-instruct --port 8001 --dtype bfloat16
  # Then uncomment:
  # - id: http
  #   label: "Lapa LLM (local vLLM)"
  #   config:
  #     url: "http://localhost:8001/v1/chat/completions"
  #     method: POST
  #     headers:
  #       Content-Type: "application/json"
  #     body:
  #       model: "lapa-llm/lapa-v0.1.2-instruct"
  #       temperature: 0.1
  #       max_tokens: 512
  #       messages: "{{prompt}}"
  #     transformResponse: "json.choices[0].message.content"

  # TODO: MamayLM - not on OpenRouter as of 2026-02.
  # Model: INSAIT-Institute/MamayLM-Gemma-3-4B-IT-v1.0 (Ukrainian Gemma fine-tune)
  # To enable locally:
  #   vllm serve INSAIT-Institute/MamayLM-Gemma-3-4B-IT-v1.0 --port 8002 --dtype bfloat16
  # Then uncomment:
  # - id: http
  #   label: "MamayLM (local vLLM)"
  #   config:
  #     url: "http://localhost:8002/v1/chat/completions"
  #     method: POST
  #     headers:
  #       Content-Type: "application/json"
  #     body:
  #       model: "INSAIT-Institute/MamayLM-Gemma-3-4B-IT-v1.0"
  #       temperature: 0.1
  #       max_tokens: 512
  #       messages: "{{prompt}}"
  #     transformResponse: "json.choices[0].message.content"

# Test cases - generated by prepare_eval_data.py
tests: test_cases/hutsul.json

# Default assertions applied to every test case x prompt x provider combination
defaultTest:
  assert:
    # 1. Basic sanity: non-empty output with Cyrillic vowels
    - type: contains-any
      value:
        - "а"
        - "е"
        - "і"
        - "о"
        - "у"

    # 2. LLM judge: fluency in standard literary Ukrainian, no remaining dialect features
    - type: llm-rubric
      provider: openrouter:google/gemini-2.0-flash-001
      value: |
        Evaluate whether the text is fluent, grammatically correct standard literary Ukrainian.
        The text should NOT contain Hutsul dialect features such as:
        - "єк" instead of "як"
        - "ни" instead of "не"
        - "тай" as a standalone conjunction (not preceded by a comma)
        - "и" where standard Ukrainian has "і" (e.g., "из" instead of "із", "Иван" instead of "Іван")
        - reflexive particle "си" or "сі" instead of "ся"
        - verb endings in "-єт" instead of "-є" (e.g., "маєт" instead of "має")

        Score 1.0 if the text reads as natural, standard literary Ukrainian with no dialect features.
        Score 0.5 if there are minor issues or 1-2 remaining dialect forms.
        Score 0.0 if the text contains obvious dialect features or is not Ukrainian.
      threshold: 0.6

    # 3. chrF score against reference translation (character-level similarity)
    - type: javascript
      value: file://assertions/chrf_score.js
      threshold: 0.45

# Output configuration
outputPath: ./results/

# Evaluation settings
evaluateOptions:
  maxConcurrency: 2
  showProgressBar: true
